# Sveltia CMS config (Decap-compatible format).
#
# Auth proxy: a Cloudflare Worker running sveltia-cms-auth
# (https://github.com/sveltia/sveltia-cms-auth), backing a GitHub OAuth App
# whose callback URL is <base_url>/callback. Default auth_endpoint ("auth")
# is used, so base_url alone is enough.
backend:
  name: github
  repo: Empirica-Ventures/FQ
  branch: main
  base_url: https://sveltia-cms-auths.rafaybinyousuf314.workers.dev

# Every edit opens a PR instead of committing straight to main, so Vercel
# builds a real preview deployment of the actual page before anything goes
# live — see build.js's Phase 1 hardening and the CI clipping gate, neither
# of which a raw commit-to-main workflow would get a chance to run against.
publish_mode: editorial_workflow

# Points directly at the repo's real asset root, not a separate "uploads"
# folder — this is required, not cosmetic. Sveltia can only render a live
# preview thumbnail for a file that lives inside the exact media_folder/
# public_folder pair configured here (a known upstream limitation:
# https://github.com/sveltia/sveltia-cms/issues/497 — the image widget
# can't resolve or preview a path outside it). Every image already on this
# site lives under /assets/..., so pointing here means every existing
# image slot previews correctly, and a future upload lands right in the
# same tree build.js already copies wholesale into dist/ -- no separate
# copy step needed.
media_folder: "assets"
public_folder: "/assets"

# Not exposed here, on purpose:
#
# - content/taxonomies/*.json (case-study-categories, insights-categories):
#   each category's select options are also hand-typed into this file (see
#   the Case Studies "category" field below, and Insights Articles further
#   down) and referenced by slug elsewhere (filter tabs, topic cards).
#   Editing the taxonomy file alone would desync it from those hardcoded
#   options without a build-time check tying the two together — needs a
#   schema/validation pass in build.js before it's safe to widen here.
# - content/images.json's width/height pairs ARE exposed below (see "Site
#   Images") since they're meant to be edited whenever the image changes —
#   verify/check_image_dims.js only warns (not fails) on a mismatch, since
#   these are CLS-prevention layout hints, not exact pixel enforcement.
#
# Collections below are grouped to match the site's own navigation (Home,
# About, Services, How We Work, Industries, Case Studies, Insights,
# Contact), then a final "Site-Wide" group for content that isn't scoped
# to a single page. `divider: true` entries draw a line between groups;
# Sveltia has no group-header text yet (that's an unreleased "nested
# collections" feature), so every label also carries an ALL-CAPS page
# prefix as the stand-in for a real section header.
#
# Within each group, collections are ordered by how often a non-technical
# editor is actually likely to open them: quick text edits (quotes,
# questions, blurbs) first, anything involving an image upload or a
# mostly-locked reference list last — not necessarily the order things
# appear on the page.
collections:
  # ---------------------------------------------------------------- HOME
  - name: "copy_home"
    label: "HOME — Page Text"
    icon: "text_fields"
    files:
      - file: "content/copy/home.json"
        label: "Home Page Text"
        name: "copy_home"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Headline (outlined words)", name: "headlineOutlined", widget: "string" }
              - { label: "Headline (rest of the sentence)", name: "headlineRest", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - { label: "Audience Line (small print under the body)", name: "meta", widget: "text" }
              - { label: "Primary Button Label", name: "primaryCtaLabel", widget: "string" }
              - { label: "Secondary Button Label", name: "secondaryCtaLabel", widget: "string" }
              - label: "Carousel Slides"
                name: "slides"
                widget: "object"
                collapsed: true
                # Four fixed slides, one per hero background image (see
                # SITE-WIDE — Site Images: "Home Hero — UAE/KSA/Qatar/Bahrain").
                # The slide keys are locked to those image slots; only the two
                # labels below are editable.
                fields:
                  - label: "UAE Slide"
                    name: "uae"
                    widget: "object"
                    fields:
                      - label: "Region Caption"
                        name: "regionLabel"
                        widget: "string"
                        hint: "One value, two places: the visible caption beside the carousel dots, and the label stored on this slide's dot that js/main.js swaps into that caption when the slide changes. Keep the screen-reader label below naming the same region."
                      - label: "Carousel Dot Screen-Reader Label"
                        name: "dotLabel"
                        widget: "string"
                        hint: "Heard only by screen readers, never shown on screen. Update it whenever the region caption above changes, or the two will disagree."
                  - label: "KSA Slide"
                    name: "ksa"
                    widget: "object"
                    fields:
                      - label: "Region Caption"
                        name: "regionLabel"
                        widget: "string"
                        hint: "One value, two places: the visible caption beside the carousel dots, and the label stored on this slide's dot that js/main.js swaps into that caption when the slide changes. Keep the screen-reader label below naming the same region."
                      - label: "Carousel Dot Screen-Reader Label"
                        name: "dotLabel"
                        widget: "string"
                        hint: "Heard only by screen readers, never shown on screen. Update it whenever the region caption above changes, or the two will disagree."
                  - label: "Qatar Slide"
                    name: "qatar"
                    widget: "object"
                    fields:
                      - label: "Region Caption"
                        name: "regionLabel"
                        widget: "string"
                        hint: "One value, two places: the visible caption beside the carousel dots, and the label stored on this slide's dot that js/main.js swaps into that caption when the slide changes. Keep the screen-reader label below naming the same region."
                      - label: "Carousel Dot Screen-Reader Label"
                        name: "dotLabel"
                        widget: "string"
                        hint: "Heard only by screen readers, never shown on screen. Update it whenever the region caption above changes, or the two will disagree."
                  - label: "Bahrain Slide"
                    name: "bahrain"
                    widget: "object"
                    fields:
                      - label: "Region Caption"
                        name: "regionLabel"
                        widget: "string"
                        hint: "One value, two places: the visible caption beside the carousel dots, and the label stored on this slide's dot that js/main.js swaps into that caption when the slide changes. Keep the screen-reader label below naming the same region."
                      - label: "Carousel Dot Screen-Reader Label"
                        name: "dotLabel"
                        widget: "string"
                        hint: "Heard only by screen readers, never shown on screen. Update it whenever the region caption above changes, or the two will disagree."
          - label: "Problem & Solution Table"
            name: "problemSolution"
            widget: "object"
            collapsed: true
            # The four rows are a fixed 4-row table in the markup, so there are
            # exactly four challenge/solution pairs to fill in — no more, no
            # fewer.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Heading (2 lines)"
                name: "heading"
                widget: "list"
                field: { label: "Line", name: "line", widget: "string" }
                min: 2
                max: 2
              - { label: "Left Column Label (the challenge)", name: "challengeLabel", widget: "string" }
              - { label: "Right Column Label (how FQ helps)", name: "solutionLabel", widget: "string" }
              - label: "Row 1"
                name: "row1"
                widget: "object"
                fields:
                  - { label: "Challenge", name: "challenge", widget: "string" }
                  - { label: "How FQ Helps", name: "solution", widget: "string" }
              - label: "Row 2"
                name: "row2"
                widget: "object"
                fields:
                  - { label: "Challenge", name: "challenge", widget: "string" }
                  - { label: "How FQ Helps", name: "solution", widget: "string" }
              - label: "Row 3"
                name: "row3"
                widget: "object"
                fields:
                  - { label: "Challenge", name: "challenge", widget: "string" }
                  - { label: "How FQ Helps", name: "solution", widget: "string" }
              - label: "Row 4"
                name: "row4"
                widget: "object"
                fields:
                  - { label: "Challenge", name: "challenge", widget: "string" }
                  - { label: "How FQ Helps", name: "solution", widget: "string" }
          - label: "Trust-Intro Section"
            name: "trustIntro"
            widget: "object"
            collapsed: true
            # The quote cards in this section are edited in HOME — Testimonials.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
          - label: "Arabic Statement Band"
            name: "statement"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Caption (letter-spaced wordmark)", name: "caption", widget: "string" }
              - { label: "Arabic Headline", name: "headline", widget: "string" }
              - { label: "English Tagline (under the Arabic)", name: "tagline", widget: "string" }
          - label: "Services Teaser Section"
            name: "services"
            widget: "object"
            collapsed: true
            # The service cards themselves come from SERVICES — Service List.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Service Card Link Label", name: "cardLinkLabel", widget: "string" }
              - { label: "View-All Button Label", name: "viewAllLabel", widget: "string" }
          - label: "Industries Teaser Section"
            name: "industries"
            widget: "object"
            collapsed: true
            # The industry cards themselves come from INDUSTRIES — Industry List.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Sub-text", name: "subtext", widget: "text" }
              - { label: "Button Label", name: "ctaLabel", widget: "string" }
          - label: "Why FQ Section"
            name: "whyFq"
            widget: "object"
            collapsed: true
            # The five cards under this heading are in HOME — Why FQ Cards.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Heading (2 lines)"
                name: "heading"
                widget: "list"
                field: { label: "Line", name: "line", widget: "string" }
                min: 2
                max: 2
          - label: "Founders Section"
            name: "founders"
            widget: "object"
            collapsed: true
            # The two portraits are image slots — see SITE-WIDE — Site Images
            # ("Founder Portrait — Mudassir" / "— Muzammil").
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Button Label", name: "ctaLabel", widget: "string" }
              - label: "First Founder"
                name: "first"
                widget: "object"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Role", name: "role", widget: "string" }
              - label: "Second Founder"
                name: "second"
                widget: "object"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Role", name: "role", widget: "string" }
          - label: "How It Works Section"
            name: "howItWorks"
            widget: "object"
            collapsed: true
            # The four numbered steps are in HOME — How It Works.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Heading (2 lines)"
                name: "heading"
                widget: "list"
                field: { label: "Line", name: "line", widget: "string" }
                min: 2
                max: 2
          - label: "FAQ Section"
            name: "faq"
            widget: "object"
            collapsed: true
            # The questions and answers themselves are in HOME — FAQ.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - label: "Closing Call-to-Action"
            name: "finalCta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Sub-text", name: "subtext", widget: "text" }
              - { label: "Button Label", name: "buttonLabel", widget: "string" }

  - name: "testimonials"
    label: "HOME — Testimonials"
    icon: "format_quote"
    # This section's own eyebrow and heading are text — see "HOME — Page Text".
    files:
      - file: "content/collections/testimonials.json"
        label: "Testimonials"
        name: "testimonials"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # Unlocked: css/home-trust-intro.css's .trust-intro__cards now
            # wraps to additional rows (flex-wrap + a real width
            # constraint) instead of clipping past a fixed-width single
            # row, and the section's own height is computed in
            # src/render/home/03-trust-intro.js from items.length rather
            # than hardcoded -- verified by simulating a 4th testimonial
            # through the real render function, which wrapped to a
            # visible 2nd row instead of clipping. min:3 keeps the count
            # from ever dropping below today's real quotes; no max, since
            # the layout has no upper bound anymore.
            allow_add: true
            min: 3
            fields:
              - { label: "Quote", name: "quote", widget: "text", pattern: ['^.{1,156}$', "Keep it to 156 characters or fewer"] }
              - { label: "Attribution", name: "attribution", widget: "string" }

  - name: "trust_stats"
    label: "HOME — Trust Strip Stats"
    icon: "bar_chart"
    # The rest of the home page's section text is in "HOME — Page Text".
    files:
      - file: "content/collections/trust-stats.json"
        label: "Trust Strip Stats"
        name: "trust_stats"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/home-trust-strip.css: fixed height:120px/overflow:hidden,
            # 4 equal columns.
            allow_add: false
            min: 4
            max: 4
            fields:
              - { label: "Value", name: "value", widget: "string", pattern: ['^.{1,10}$', "Keep it short — fixed-height strip"] }
              - { label: "Label", name: "label", widget: "string" }

  - name: "faq_home"
    label: "HOME — FAQ"
    icon: "help"
    # This section's eyebrow is text — see "HOME — Page Text".
    files:
      - file: "content/pages/faq-home.json"
        label: "Home FAQ"
        name: "faq_home"
        fields:
          - label: "Heading (2 lines)"
            name: "heading"
            widget: "list"
            field: { label: "Line", name: "line", widget: "string" }
            min: 2
            max: 2
          - label: "Items"
            name: "items"
            widget: "list"
            # css/home-faq.css already uses grid-template-rows: auto and a
            # flow-layout container (no fixed height) — genuinely count-
            # agnostic, unlike almost everything else on this site.
            min: 3
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - name: "why_fq"
    label: "HOME — Why FQ Cards"
    icon: "star"
    # This section's eyebrow and heading are text — see "HOME — Page Text".
    files:
      - file: "content/collections/why-fq.json"
        label: "Why FQ"
        name: "why_fq"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # The 2-left/3-right column split is a hardcoded
            # LEFT_COLUMN_COUNT constant in src/render/home/06-why-fq.js, so
            # the count is locked.
            allow_add: false
            min: 5
            max: 5
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text", pattern: ['^.{1,141}$', "Keep it to 141 characters or fewer"] }

  - name: "how_it_works"
    label: "HOME — How It Works"
    icon: "route"
    # This section's eyebrow and heading are text — see "HOME — Page Text".
    files:
      - file: "content/collections/how-it-works.json"
        label: "How It Works"
        name: "how_it_works"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/home-how-it-works.css: fixed height:480px/overflow:hidden.
            allow_add: false
            min: 4
            max: 4
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text", pattern: ['^.{1,110}$', "Keep it to 110 characters or fewer"] }

  - divider: true

  # --------------------------------------------------------------- ABOUT
  - name: "copy_about"
    label: "ABOUT — Page Text"
    icon: "text_fields"
    files:
      - file: "content/copy/about.json"
        label: "About Page Text"
        name: "copy_about"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline Line 1", name: "headlineLine1", widget: "string" }
              - { label: "Headline Line 2 (lead-in word)", name: "headlineLine2Lead", widget: "string" }
              - { label: "Headline Line 2 (outlined words)", name: "headlineLine2Outlined", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
          - label: "Who We Are Section"
            name: "whoWeAre"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Body Paragraphs"
                name: "body"
                widget: "object"
                # Two fixed paragraph slots in the markup, not a growable list.
                fields:
                  - { label: "First Paragraph", name: "para1", widget: "text" }
                  - { label: "Second Paragraph", name: "para2", widget: "text" }
          - label: "Mission Section"
            name: "mission"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "First Mission Statement"
                name: "first"
                widget: "object"
                fields:
                  - { label: "Numbered Label", name: "label", widget: "string" }
                  - { label: "Statement", name: "statement", widget: "text" }
              - label: "Second Mission Statement"
                name: "second"
                widget: "object"
                fields:
                  - { label: "Numbered Label", name: "label", widget: "string" }
                  - { label: "Statement", name: "statement", widget: "text" }
          - label: "Values Section"
            name: "values"
            widget: "object"
            collapsed: true
            # The five value cards under this heading are in ABOUT — Values.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
          - label: "Closing Call-to-Action"
            name: "cta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Sub-text", name: "subtext", widget: "text" }
              - { label: "Button Label", name: "buttonLabel", widget: "string" }

  - name: "values"
    label: "ABOUT — Values"
    icon: "diversity_3"
    # This section's eyebrow and heading are text — see "ABOUT — Page Text".
    files:
      - file: "content/collections/values.json"
        label: "Values"
        name: "values"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/about-values.css: fixed height:520px/overflow:hidden.
            allow_add: false
            min: 5
            max: 5
            fields:
              - { label: "Title", name: "title", widget: "string", pattern: ['^.{1,43}$', "Keep it to 43 characters or fewer"] }
              - { label: "Body", name: "body", widget: "text" }

  - divider: true

  # ------------------------------------------------------------ SERVICES
  - name: "copy_services"
    label: "SERVICES — Page Text"
    icon: "text_fields"
    files:
      - file: "content/copy/services.json"
        label: "Services Page Text"
        name: "copy_services"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "Title (lead line)", name: "lead", widget: "string" }
                  - label: "Title (outlined words)"
                    name: "outlined"
                    widget: "object"
                    # Two separate outlined spans on two separate lines.
                    fields:
                      - { label: "First Outlined Words", name: "first", widget: "string" }
                      - { label: "Second Outlined Words", name: "second", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - { label: "Hero Card Label", name: "cardLabel", widget: "string" }
          - label: "Trusted-By Section"
            name: "trustedBy"
            widget: "object"
            collapsed: true
            # The client logos under this heading are in SERVICES — Trusted-By
            # Client Logos.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
          - label: "Services Grid Section"
            name: "servicesGrid"
            widget: "object"
            collapsed: true
            # The six service cards in this grid come from SERVICES — Service
            # List; only the section's own eyebrow and heading live here.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Heading"
                name: "heading"
                widget: "string"
                hint: "This heading states a count (\"Six core services\") that is NOT computed from the service list — it is plain text. If a service is ever added or removed, edit this heading by hand or the page will contradict the grid below it."
          - label: "Closing Call-to-Action"
            name: "finalCta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Sub-text", name: "subtext", widget: "text" }
              - { label: "Button Label", name: "buttonLabel", widget: "string" }

  - name: "copy_service_details"
    label: "SERVICES — Service Page Text (6 pages)"
    icon: "text_fields"
    files:
      - file: "content/copy/service-details.json"
        label: "Service Page Text"
        name: "copy_service_details"
        # One section per service page, holding that page's hero and closing
        # call-to-action. The page's own body copy and "What you get" list are
        # edited in the matching "SERVICES — Body Copy: ..." collection below.
        # The six section keys are locked to the six service slugs in
        # content/collections/services.json — there is no 7th service page.
        fields:
          - label: "Shared Section Labels (all six pages)"
            name: "bodyLabels"
            widget: "object"
            collapsed: true
            fields:
              - { label: 'Body Section Eyebrow ("What we do")', name: "whatWeDo", widget: "string" }
              - { label: 'Includes-List Heading ("What you get")', name: "whatYouGet", widget: "string" }
          - label: "Bookkeeping & Accounting Page"
            name: "bookkeeping"
            widget: "object"
            collapsed: true
            fields:
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Eyebrow", name: "eyebrow", widget: "string" }
                  - { label: "Heading (lead words)", name: "headingLead", widget: "string" }
                  - { label: "Heading (outlined words)", name: "headingOutlined", widget: "string" }
                  - { label: "Body Text", name: "body", widget: "text" }
              - label: "Closing Call-to-Action"
                name: "cta"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Sub-text", name: "subtext", widget: "text" }
                  - { label: "Button Label", name: "buttonLabel", widget: "string" }
          - label: "Cash Flow & Forecasting Page"
            name: "cashflow"
            widget: "object"
            collapsed: true
            fields:
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - { label: "Eyebrow", name: "eyebrow", widget: "string" }
                  - { label: "Heading (lead words)", name: "headingLead", widget: "string" }
                  - { label: "Heading (outlined words)", name: "headingOutlined", widget: "string" }
                  - { label: "Body Text", name: "body", widget: "text" }
              - label: "Closing Call-to-Action"
                name: "cta"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Sub-text", name: "subtext", widget: "text" }
                  - { label: "Button Label", name: "buttonLabel", widget: "string" }
          - label: "Cleanup & Catch-Up Accounting Page"
            name: "cleanup"
            widget: "object"
            collapsed: true
            fields:
              - label: "Hero"
                name: "hero"
