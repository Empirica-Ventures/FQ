# Sveltia CMS config (Decap-compatible format).
#
# Auth proxy: a Cloudflare Worker running sveltia-cms-auth
# (https://github.com/sveltia/sveltia-cms-auth), backing a GitHub OAuth App
# whose callback URL is <base_url>/callback. Default auth_endpoint ("auth")
# is used, so base_url alone is enough.
backend:
  name: github
  repo: Empirica-Ventures/FQ
  branch: main
  base_url: https://sveltia-cms-auths.rafaybinyousuf314.workers.dev

# Every edit opens a PR instead of committing straight to main, so Vercel
# builds a real preview deployment of the actual page before anything goes
# live — see build.js's Phase 1 hardening and the CI clipping gate, neither
# of which a raw commit-to-main workflow would get a chance to run against.
publish_mode: editorial_workflow

media_folder: "content/uploads"
public_folder: "/assets/uploads"

# Not exposed here, on purpose:
#
# - content/taxonomies/*.json (case-study-categories, insights-categories):
#   each category's select options are also hand-typed into this file (see
#   the Case Studies "category" field below, and Insights Articles further
#   down) and referenced by slug elsewhere (filter tabs, topic cards).
#   Editing the taxonomy file alone would desync it from those hardcoded
#   options without a build-time check tying the two together — needs a
#   schema/validation pass in build.js before it's safe to widen here.
# - content/images.json's width/height pairs ARE exposed below (see "Site
#   Images") since they're meant to be edited whenever the image changes —
#   verify/check_image_dims.js only warns (not fails) on a mismatch, since
#   these are CLS-prevention layout hints, not exact pixel enforcement.
#
# Collections below are grouped to match the site's own navigation (Home,
# About, Services, How We Work, Industries, Case Studies, Insights,
# Contact), then a final "Site-Wide" group for content that isn't scoped
# to a single page. `divider: true` entries draw a line between groups;
# Sveltia has no group-header text yet (that's an unreleased "nested
# collections" feature), so every label also carries an ALL-CAPS page
# prefix as the stand-in for a real section header.
#
# Within each group, collections are ordered by how often a non-technical
# editor is actually likely to open them: quick text edits (quotes,
# questions, blurbs) first, anything involving an image upload or a
# mostly-locked reference list last — not necessarily the order things
# appear on the page.
collections:
  # ---------------------------------------------------------------- HOME
  - name: "testimonials"
    label: "HOME — Testimonials"
    icon: "format_quote"
    files:
      - file: "content/collections/testimonials.json"
        label: "Testimonials"
        name: "testimonials"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/home-trust-intro.css: fixed height/overflow:hidden.
            allow_add: false
            min: 3
            max: 3
            fields:
              - { label: "Quote", name: "quote", widget: "text", pattern: ['^.{1,156}$', "Keep it to 156 characters or fewer"] }
              - { label: "Attribution", name: "attribution", widget: "string" }

  - name: "trust_stats"
    label: "HOME — Trust Strip Stats"
    icon: "bar_chart"
    files:
      - file: "content/collections/trust-stats.json"
        label: "Trust Strip Stats"
        name: "trust_stats"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/home-trust-strip.css: fixed height:120px/overflow:hidden,
            # 4 equal columns.
            allow_add: false
            min: 4
            max: 4
            fields:
              - { label: "Value", name: "value", widget: "string", pattern: ['^.{1,10}$', "Keep it short — fixed-height strip"] }
              - { label: "Label", name: "label", widget: "string" }

  - name: "faq_home"
    label: "HOME — FAQ"
    icon: "help"
    files:
      - file: "content/pages/faq-home.json"
        label: "Home FAQ"
        name: "faq_home"
        fields:
          - label: "Heading (2 lines)"
            name: "heading"
            widget: "list"
            field: { label: "Line", name: "line", widget: "string" }
            min: 2
            max: 2
          - label: "Items"
            name: "items"
            widget: "list"
            # css/home-faq.css already uses grid-template-rows: auto and a
            # flow-layout container (no fixed height) — genuinely count-
            # agnostic, unlike almost everything else on this site.
            min: 3
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - name: "why_fq"
    label: "HOME — Why FQ Cards"
    icon: "star"
    files:
      - file: "content/collections/why-fq.json"
        label: "Why FQ"
        name: "why_fq"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # The 2-left/3-right column split is a hardcoded
            # LEFT_COLUMN_COUNT constant in src/render/home/06-why-fq.js, so
            # the count is locked.
            allow_add: false
            min: 5
            max: 5
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text", pattern: ['^.{1,141}$', "Keep it to 141 characters or fewer"] }

  - name: "how_it_works"
    label: "HOME — How It Works"
    icon: "route"
    files:
      - file: "content/collections/how-it-works.json"
        label: "How It Works"
        name: "how_it_works"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/home-how-it-works.css: fixed height:480px/overflow:hidden.
            allow_add: false
            min: 4
            max: 4
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text", pattern: ['^.{1,110}$', "Keep it to 110 characters or fewer"] }

  - divider: true

  # --------------------------------------------------------------- ABOUT
  - name: "values"
    label: "ABOUT — Values"
    icon: "diversity_3"
    files:
      - file: "content/collections/values.json"
        label: "Values"
        name: "values"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/about-values.css: fixed height:520px/overflow:hidden.
            allow_add: false
            min: 5
            max: 5
            fields:
              - { label: "Title", name: "title", widget: "string", pattern: ['^.{1,43}$', "Keep it to 43 characters or fewer"] }
              - { label: "Body", name: "body", widget: "text" }

  - divider: true

  # ------------------------------------------------------------ SERVICES
  - name: "service_bookkeeping"
    label: "SERVICES — Body Copy: Bookkeeping & Accounting"
    icon: "receipt_long"
    files:
      - file: "content/pages/service-bookkeeping.json"
        label: "Bookkeeping & Accounting"
        name: "service_bookkeeping"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Paragraphs (1–3 — real flow layout, no clipping risk)"
            name: "paragraphs"
            widget: "list"
            min: 1
            max: 3
            field: { label: "Paragraph", name: "paragraph", widget: "text", pattern: ['^.{1,620}$', "Keep each paragraph to 620 characters or fewer"] }
          - label: "What You Get (exactly 6 items)"
            name: "includes"
            widget: "list"
            allow_add: false
            min: 6
            max: 6
            field: { label: "Item", name: "item", widget: "string" }

  - name: "service_cashflow"
    label: "SERVICES — Body Copy: Cash Flow & Forecasting"
    icon: "payments"
    files:
      - file: "content/pages/service-cashflow.json"
        label: "Cash Flow & Forecasting"
        name: "service_cashflow"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Paragraphs (1–3)"
            name: "paragraphs"
            widget: "list"
            min: 1
            max: 3
            field: { label: "Paragraph", name: "paragraph", widget: "text", pattern: ['^.{1,620}$', "Keep each paragraph to 620 characters or fewer"] }
          - label: "What You Get (exactly 6 items)"
            name: "includes"
            widget: "list"
            allow_add: false
            min: 6
            max: 6
            field: { label: "Item", name: "item", widget: "string" }

  - name: "service_cleanup"
    label: "SERVICES — Body Copy: Cleanup & Catch-Up Accounting"
    icon: "cleaning_services"
    files:
      - file: "content/pages/service-cleanup.json"
        label: "Cleanup & Catch-Up Accounting"
        name: "service_cleanup"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Paragraphs (1–3)"
            name: "paragraphs"
            widget: "list"
            min: 1
            max: 3
            field: { label: "Paragraph", name: "paragraph", widget: "text", pattern: ['^.{1,620}$', "Keep each paragraph to 620 characters or fewer"] }
          - label: "What You Get (exactly 6 items)"
            name: "includes"
            widget: "list"
            allow_add: false
            min: 6
            max: 6
            field: { label: "Item", name: "item", widget: "string" }

  - name: "service_fpa"
    label: "SERVICES — Body Copy: FP&A / Business Finance"
    icon: "insights"
    files:
      - file: "content/pages/service-fpa.json"
        label: "FP&A / Business Finance"
        name: "service_fpa"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Paragraphs (1–3)"
            name: "paragraphs"
            widget: "list"
            min: 1
            max: 3
            field: { label: "Paragraph", name: "paragraph", widget: "text", pattern: ['^.{1,620}$', "Keep each paragraph to 620 characters or fewer"] }
          - label: "What You Get (exactly 6 items)"
            name: "includes"
            widget: "list"
            allow_add: false
            min: 6
            max: 6
            field: { label: "Item", name: "item", widget: "string" }

  - name: "service_mgmt_reporting"
    label: "SERVICES — Body Copy: Management Reporting"
    icon: "monitoring"
    files:
      - file: "content/pages/service-mgmt-reporting.json"
        label: "Management Reporting"
        name: "service_mgmt_reporting"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Paragraphs (1–3)"
            name: "paragraphs"
            widget: "list"
            min: 1
            max: 3
            field: { label: "Paragraph", name: "paragraph", widget: "text", pattern: ['^.{1,620}$', "Keep each paragraph to 620 characters or fewer"] }
          - label: "What You Get (exactly 6 items)"
            name: "includes"
            widget: "list"
            allow_add: false
            min: 6
            max: 6
            field: { label: "Item", name: "item", widget: "string" }

  - name: "service_tax_vat"
    label: "SERVICES — Body Copy: Tax & VAT Compliance"
    icon: "gavel"
    files:
      - file: "content/pages/service-tax-vat.json"
        label: "Tax & VAT Compliance"
        name: "service_tax_vat"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Paragraphs (1–3)"
            name: "paragraphs"
            widget: "list"
            min: 1
            max: 3
            field: { label: "Paragraph", name: "paragraph", widget: "text", pattern: ['^.{1,620}$', "Keep each paragraph to 620 characters or fewer"] }
          - label: "What You Get (exactly 6 items)"
            name: "includes"
            widget: "list"
            allow_add: false
            min: 6
            max: 6
            field: { label: "Item", name: "item", widget: "string" }

  - name: "services"
    label: "SERVICES — Service List (Grid, Hero, Home Teaser, Footer)"
    icon: "design_services"
    files:
      - file: "content/collections/services.json"
        label: "Services"
        name: "services"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/services-grid.css is a fixed 2x604px-column grid at
            # height:1620px/overflow:hidden. The same 6 slugs are also
            # referenced by content/collections/industries.json's
            # serviceSlugs and feed 4 other render sites (hero, home,
            # footer, industries) plus the footer's own services column —
            # renaming a slug here would silently break all of them.
            allow_add: false
            min: 6
            max: 6
            fields:
              - label: "Slug (locked — referenced by Industries and the footer)"
                name: "slug"
                widget: "hidden"
              - label: "Page URL (locked)"
                name: "href"
                widget: "hidden"
              - label: "Full Name"
                name: "name"
                widget: "string"
              - label: "Home Card Name Lines (1–2 lines)"
                name: "homeNameLines"
                widget: "list"
                field: { label: "Line", name: "line", widget: "string" }
                min: 1
                max: 2
              - label: "Services-Grid Blurb"
                name: "gridBlurb"
                widget: "text"
                pattern: ['^.{1,90}$', "Keep it to 90 characters or fewer"]
              - label: "Services-Grid Tag Rows"
                name: "gridTagRows"
                widget: "list"
                hint: "Each row's vertical position is locked (hand-tuned per service); only the tag text is editable."
                fields:
                  - { label: "Row Position (locked)", name: "top", widget: "hidden" }
                  - label: "Tags"
                    name: "tags"
                    widget: "list"
                    field: { label: "Tag", name: "tag", widget: "string" }
              - label: "Services-Grid Link Text"
                name: "gridLinkText"
                widget: "string"
              - label: "Home Card Blurb"
                name: "homeBlurb"
                widget: "string"
                pattern: ['^.{1,55}$', "Keep it to 55 characters or fewer"]

  - name: "trusted_by"
    label: "SERVICES — Trusted-By Client Logos"
    icon: "verified"
    files:
      - file: "content/collections/trusted-by.json"
        label: "Trusted By"
        name: "trusted_by"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/services-trusted-by.css is a fixed 13-column logo strip.
            # Each logo's left/top/width/height is a hand-measured crop
            # offset with no relation to the source file, so those stay
            # locked — adding new logos needs that offset work done outside
            # the CMS first (see the Phase 5 extraction commit).
            allow_add: false
            min: 26
            max: 26
            fields:
              - label: "Logo Image"
                name: "src"
                widget: "image"
              - label: "Alt Text"
                name: "alt"
                widget: "string"
              - { label: "Left Offset (locked)", name: "left", widget: "hidden" }
              - { label: "Top Offset (locked)", name: "top", widget: "hidden" }
              - { label: "Width (locked)", name: "width", widget: "hidden" }
              - { label: "Height (locked)", name: "height", widget: "hidden" }
              - label: "Client Name"
                name: "label"
                widget: "string"

  - divider: true

  # -------------------------------------------------------- HOW WE WORK
  - name: "process_steps"
    label: "HOW WE WORK — Process Steps"
    icon: "linear_scale"
    files:
      - file: "content/collections/process-steps.json"
        label: "Process Steps"
        name: "process_steps"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # A hand-drawn 5-step snake-path flowchart (css/hww-process.css)
            # — there's no defined shape for a 6th step, so the count is
            # locked. Each step's color variants don't follow a clean
            # position rule (unlike every other red/navy/green rotation on
            # this site), so they're stored but locked from editing —
            # they're presentational, not editorial content.
            allow_add: false
            min: 5
            max: 5
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "text", pattern: ['^.{1,80}$', "Keep it to 80 characters or fewer"] }
              - { label: "Badge Background (locked)", name: "badgeBg", widget: "hidden" }
              - { label: "Number Color (locked)", name: "numColor", widget: "hidden" }
              - { label: "Label Variant (locked)", name: "labelVariant", widget: "hidden" }
              - { label: "Title Variant (locked)", name: "titleVariant", widget: "hidden" }
              - { label: "Desc Variant (locked)", name: "descVariant", widget: "hidden" }

  - name: "tool_logos"
    label: "HOW WE WORK — Toolkit Logos"
    icon: "construction"
    files:
      - file: "content/collections/tool-logos.json"
        label: "Toolkit Logos"
        name: "tool_logos"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # The one genuinely count-agnostic collection: js/main.js
            # measures the marquee's loop distance from the live DOM at
            # runtime, so adding or removing a logo needs no CSS/JS change.
            min: 1
            fields:
              - label: "Logo Image"
                name: "src"
                widget: "image"
              - label: "Alt Text"
                name: "alt"
                widget: "string"

  - divider: true

  # ---------------------------------------------------------- INDUSTRIES
  - name: "industries"
    label: "INDUSTRIES — Industry List"
    icon: "factory"
    files:
      - file: "content/collections/industries.json"
        label: "Industries"
        name: "industries"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # Fixed 6-tab quick-nav bar (nowrap, css/industries-quick-nav.css)
            # + 6 hand-built detail sections (css/industries-detail.css:
            # 460px/overflow:hidden challenges+services panel) + the home
            # teaser grid — count and id are both locked.
            allow_add: false
            min: 6
            max: 6
            fields:
              - label: "ID (locked — used by quick-nav and icon lookup)"
                name: "id"
                widget: "hidden"
              - label: "Label"
                name: "label"
                widget: "string"
              - label: "Heading Lines (1–2 lines)"
                name: "headingLines"
                widget: "list"
                field: { label: "Line", name: "line", widget: "string" }
                min: 1
                max: 2
              - label: "Tagline"
                name: "tagline"
                widget: "string"
              - label: "Description"
                name: "description"
                widget: "text"
              - label: "Challenges (exactly 4 — fixed-height panel)"
                name: "challenges"
                widget: "list"
                allow_add: false
                min: 4
                max: 4
                field: { label: "Challenge", name: "challenge", widget: "string" }
              - label: "Services We Provide (exactly 4 — fixed-height panel)"
                name: "serviceSlugs"
                widget: "list"
                allow_add: false
                min: 4
                max: 4
                field:
                  label: "Service"
                  name: "slug"
                  widget: "select"
                  options:
                    - { label: "FP&A / Business Finance", value: "fpa" }
                    - { label: "Management Reporting", value: "mgmt-reporting" }
                    - { label: "Cash Flow & Forecasting", value: "cashflow" }
                    - { label: "Bookkeeping & Accounting", value: "bookkeeping" }
                    - { label: "Tax & VAT Compliance", value: "tax-vat" }
                    - { label: "Cleanup & Catch-Up Accounting", value: "cleanup" }
              - label: "Case Study Teaser Text"
                name: "caseStudyText"
                widget: "string"
              - label: "Home Teaser Description"
                name: "homeDesc"
                widget: "string"
                pattern: ['^.{1,62}$', "Keep it to 62 characters or fewer (2-line budget)"]
              - label: "Home Teaser Accent"
                name: "homeAccent"
                widget: "select"
                options: ["red", "green", "cream"]

  - divider: true

  # -------------------------------------------------------- CASE STUDIES
  - name: "case_studies"
    label: "CASE STUDIES — Case Study List"
    icon: "cases"
    files:
      - file: "content/collections/case-studies.json"
        label: "Case Studies"
        name: "case_studies"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # Exactly 6 today. css/cs-grid.css lays these out as 2 rows of
            # 3 in a `height: 920px; overflow: hidden` section — a 7th
            # item opens a third row that would render entirely invisible,
            # no error, no scrollbar. Revisit only once that container is
            # made auto-height as its own reviewed visual change.
            allow_add: false
            min: 6
            max: 6
            fields:
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Retail & E-Commerce", value: "retail-ecommerce" }
                  - { label: "Construction", value: "construction" }
                  - { label: "Professional Services", value: "professional-services" }
                  - { label: "Logistics", value: "logistics" }
                  - { label: "Startups", value: "startups" }
                hint: "Also drives the printed category label on the card and the filter-tab grouping — see content/taxonomies/case-study-categories.json."
              - label: "Accent Color"
                name: "accent"
                widget: "select"
                options: ["green", "navy"]
              - label: "Monochrome Icon Style"
                name: "mono"
                widget: "boolean"
                default: false
              - label: "Featured Badge"
                name: "featured"
                widget: "boolean"
                default: false
              - label: "Headline Stat Value"
                name: "value"
                widget: "string"
                # Longest live today is 9 chars ("VAT-Ready", "+AED 8.4M").
                # This is a soft hint, not the real guard: the field is
                # nowrap at 56px in a 440px card, so actual safety comes
                # from the CI mobile-clipping audit (verify/mobile_audit.js),
                # which measures real rendered pixels regardless of which
                # characters are used.
                pattern: ['^.{1,14}$', "Keep it to 14 characters or fewer"]
              - label: "Stat Label"
                name: "statLabel"
                widget: "string"
                pattern: ['^.{1,40}$', "Keep it to 40 characters or fewer"]
              - label: "Stat Sub-line"
                name: "statSub"
                widget: "string"
                pattern: ['^.{1,45}$', "Keep it to 45 characters or fewer"]
              - label: "Challenge"
                name: "challenge"
                widget: "text"
                pattern: ['^.{1,160}$', "Keep it to 160 characters or fewer"]
              - label: "Outcome"
                name: "outcome"
                widget: "text"
                pattern: ['^.{1,160}$', "Keep it to 160 characters or fewer"]
              - label: "Tags"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }
                # .cs-grid__tags has no flex-wrap, so tags run off the
                # 440px card horizontally past 3 at today's typical lengths.
                min: 2
                max: 3

  - divider: true

  # ------------------------------------------------------------ INSIGHTS
  - name: "insights_articles"
    label: "INSIGHTS — Articles"
    icon: "article"
    files:
      - file: "content/collections/insights-articles.json"
        label: "Insights Articles"
        name: "insights_articles"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # 1 featured slot (css/insights-featured.css: fixed 440px,
            # overflow:hidden) + 6 grid slots (css/insights-article-grid.css:
            # fixed 920px 2x3 grid, overflow:hidden) — an 8th item or a 2nd
            # featured article opens an invisible extra slot/row.
            allow_add: false
            min: 7
            max: 7
            fields:
              - label: "URL Slug (locked — this is the page's address)"
                name: "slug"
                widget: "hidden"
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Finance Tips", value: "finance-tips" }
                  - { label: "Cash Flow", value: "cash-flow" }
                  - { label: "VAT & Compliance", value: "vat-compliance" }
                  - { label: "Business Growth", value: "business-growth" }
                  - { label: "CFO Insights", value: "cfo-insights" }
              - label: "Featured Article (exactly one item must be checked)"
                name: "featured"
                widget: "boolean"
                default: false
              - label: "Title"
                name: "title"
                widget: "string"
                pattern: ['^.{1,132}$', "Keep it to 132 characters or fewer"]
              - label: "Excerpt"
                name: "excerpt"
                widget: "text"
                pattern: ['^.{1,183}$', "Keep it to 183 characters or fewer"]
              - label: "Read Time"
                name: "readTime"
                widget: "string"
                pattern: ['^\d{1,2} min read$', 'Format: "N min read"']

  - divider: true

  # ------------------------------------------------------------- CONTACT
  - name: "faq_contact"
    label: "CONTACT — FAQ"
    icon: "help"
    files:
      - file: "content/pages/faq-contact.json"
        label: "Contact FAQ"
        name: "faq_contact"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Items"
            name: "items"
            widget: "list"
            # css/contact-quick-faq.css: same auto-height flow layout as
            # the home FAQ.
            min: 3
            fields:
              - { label: "Question", name: "question", widget: "string" }
