  - name: "footer_social_links"
    label: "SITE-WIDE — Footer Social Links"
    icon: "share"
    # The footer's column titles and taglines are in "SITE-WIDE — Navbar, Footer & 404 Text".
    files:
      - file: "content/collections/footer-social-links.json"
        label: "Footer Social Links"
        name: "footer_social_links"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # Unlocked: css/footer.css's .footer__inner height (and the
            # divider/bottom-row positions below it) are now computed in
            # src/render/footer/inner-style.js from the tallest of the
            # footer's four columns, instead of a hardcoded 400px sized to
            # exactly 3 of these -- verified by rendering 6 social links
            # through the real footer and confirming the divider/bottom row
            # move down to match rather than getting clipped. These hrefs
            # point to external social profiles with no build-time route to
            # break, so both label and URL are editable, same as before.
            allow_add: true
            min: 3
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Profile URL", name: "href", widget: "string" }

  - name: "nav_links"
    label: "SITE-WIDE — Top Navigation Links"
    icon: "menu"
    # The navbar's logo alt text and button label are in "SITE-WIDE — Navbar, Footer & 404 Text".
    files:
      - file: "content/collections/nav-links.json"
        label: "Top Navigation Links"
        name: "nav_links"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/navbar.css: nowrap labels, no wrap protection -- a 9th
            # link has nowhere to go. Each href points to one of this
            # site's own pages, so it's locked (an internal link this
            # site doesn't actually have would 404); only the visible
            # label text is editable.
            allow_add: false
            min: 8
            max: 8
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Page URL (locked)", name: "href", widget: "hidden" }

  - name: "footer_company_links"
    label: "SITE-WIDE — Footer Company Links"
    icon: "link"
    # The footer's column titles and taglines are in "SITE-WIDE — Navbar, Footer & 404 Text".
    files:
      - file: "content/collections/footer-company-links.json"
        label: "Footer Company Links"
        name: "footer_company_links"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # Unlocked, same height fix as Footer Social Links above (see
            # src/render/footer/inner-style.js) -- verified by rendering 9
            # company links through the real footer.
            #
            # href stays off free text, unlike the social links: this list
            # points at this site's own pages, and a hand-typed path here has
            # no build-time check the way a slug/category select elsewhere on
            # this site does, so a typo would be a silent 404 rather than a
            # build failure. A select of the site's real pages makes every
            # value valid by construction instead -- same reasoning as the
            # Industries "Service We Provide" select. The Top Navigation
            # Links below stay fully locked regardless: css/navbar.css has no
            # spare room for a 9th nowrap link, so that one has no safe
            # "add" to offer.
            allow_add: true
            min: 6
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - label: "Links To"
                name: "href"
                widget: "select"
                options:
                  - { label: "Home", value: "/index.html" }
                  - { label: "About", value: "/about.html" }
                  - { label: "Services", value: "/services.html" }
                  - { label: "How We Work", value: "/how-we-work.html" }
                  - { label: "Industries", value: "/industries.html" }
                  - { label: "Case Studies", value: "/case-studies.html" }
                  - { label: "Insights", value: "/insights.html" }
                  - { label: "Partners", value: "/partners.html" }
                  - { label: "Contact", value: "/contact.html" }

  - name: "images"
    label: "SITE-WIDE — Site Images"
    icon: "image"
    files:
      - file: "content/images.json"
        label: "Site Images"
        name: "images"
        fields:
          - label: "Images"
            name: "items"
            widget: "object"
            # Every key below is a fixed slot referenced by name from a
            # specific {{IMG_<KEY>_...}} token in a specific partial (see
            # build.js's imageTokens()) — the keys themselves are locked;
            # only each slot's file, alt text, and real dimensions are
            # editable. Width/height are NOT locked: they're meant to be
            # updated whenever the image is replaced (verify/check_image_
            # dims.js only warns, never fails, on a mismatch, since these
            # are CLS-prevention layout hints, not exact pixel enforcement).
            fields:
              - label: "Home Hero — UAE"
                name: "home-hero-uae"
                widget: "object"
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Alt Text", name: "alt", widget: "string" }
                  - { label: "Width (px)", name: "width", widget: "number", value_type: "int" }
                  - { label: "Height (px)", name: "height", widget: "number", value_type: "int" }
