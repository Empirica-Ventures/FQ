<section class="hww-hero">
  <div class="hww-hero__bg" aria-hidden="true">
    <img src="{{IMG_HOW_WE_WORK_HERO_BG_SRC}}" width="{{IMG_HOW_WE_WORK_HERO_BG_WIDTH}}" height="{{IMG_HOW_WE_WORK_HERO_BG_HEIGHT}}" alt="{{IMG_HOW_WE_WORK_HERO_BG_ALT}}" loading="eager" fetchpriority="high" />
  </div>
  <div class="hww-hero__inner">
    <div class="hww-hero__grid" aria-hidden="true"></div>

    <div class="hww-hero__ring hww-hero__ring--1" aria-hidden="true"></div>
    <div class="hww-hero__ring hww-hero__ring--2" aria-hidden="true"></div>
    <div class="hww-hero__ring hww-hero__ring--3" aria-hidden="true"></div>
    <div class="hww-hero__dot" aria-hidden="true"></div>

    <p class="hww-hero__eyebrow animate-on-scroll">{{TXT_HOW_WE_WORK_HERO_EYEBROW}}</p>
    <h1 class="hww-hero__heading animate-on-scroll">
      <span class="hww-hero__heading-line">{{TXT_HOW_WE_WORK_HERO_HEADING_LINE1}}</span>
      <span class="hww-hero__heading-line"><span class="text-outline">{{TXT_HOW_WE_WORK_HERO_HEADING_LINE2_OUTLINED}}</span> {{TXT_HOW_WE_WORK_HERO_HEADING_LINE2_REST}}</span>
      <span class="hww-hero__heading-line">{{TXT_HOW_WE_WORK_HERO_HEADING_LINE3}}</span>
    </h1>
    <div class="hww-hero__rule animate-on-scroll"></div>
    <p class="hww-hero__body animate-on-scroll">{{TXT_HOW_WE_WORK_HERO_BODY}}</p>
  </div>
</section>
