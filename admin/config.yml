                widget: "select"
                options:
                  - { label: "Retail & E-Commerce", value: "retail-ecommerce" }
                  - { label: "Construction", value: "construction" }
                  - { label: "Professional Services", value: "professional-services" }
                  - { label: "Logistics", value: "logistics" }
                  - { label: "Startups", value: "startups" }
                hint: "Also drives the printed category label on the card and the filter-tab grouping — see content/taxonomies/case-study-categories.json."
              - label: "Accent Color"
                name: "accent"
                widget: "select"
                options: ["green", "navy"]
              - label: "Monochrome Icon Style"
                name: "mono"
                widget: "boolean"
                default: false
              - label: "Featured Badge"
                name: "featured"
                widget: "boolean"
                default: false
              - label: "Headline Stat Value"
                name: "value"
                widget: "string"
                # Longest live today is 9 chars ("VAT-Ready", "+AED 8.4M").
                # This is a soft hint, not the real guard: the field is
                # nowrap at 56px in a 440px card, so actual safety comes
                # from the CI mobile-clipping audit (verify/mobile_audit.js),
                # which measures real rendered pixels regardless of which
                # characters are used.
                pattern: ['^.{1,14}$', "Keep it to 14 characters or fewer"]
              - label: "Stat Label"
                name: "statLabel"
                widget: "string"
                pattern: ['^.{1,40}$', "Keep it to 40 characters or fewer"]
              - label: "Stat Sub-line"
                name: "statSub"
                widget: "string"
                pattern: ['^.{1,45}$', "Keep it to 45 characters or fewer"]
              - label: "Challenge"
                name: "challenge"
                widget: "text"
                pattern: ['^.{1,160}$', "Keep it to 160 characters or fewer"]
              - label: "Outcome"
                name: "outcome"
                widget: "text"
                pattern: ['^.{1,160}$', "Keep it to 160 characters or fewer"]
              - label: "Tags"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }
                # .cs-grid__tags has no flex-wrap, so tags run off the
                # 440px card horizontally past 3 at today's typical lengths.
                min: 2
                max: 3

  - divider: true

  # ------------------------------------------------------------ INSIGHTS
  - name: "copy_insights"
    label: "INSIGHTS — Page Text"
    icon: "text_fields"
    files:
      - file: "content/copy/insights.json"
        label: "Insights Page Text"
        name: "copy_insights"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Title (lead words)", name: "titleLead", widget: "string" }
              - { label: "Title (outlined words)", name: "titleOutlined", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - label: "Newsletter Signup Box"
                name: "newsletter"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Sub-title", name: "subtitle", widget: "string" }
                  - { label: "Email Field Placeholder", name: "emailPlaceholder", widget: "string" }
                  - label: "Email Field Screen-Reader Label"
                    name: "emailLabel"
                    widget: "string"
                    hint: "The field has no visible label — this is what a screen reader announces, so it must stay meaningful on its own."
                  - { label: "Subscribe Button Label", name: "submitLabel", widget: "string" }
          - label: "Featured Article Section"
            name: "featured"
            widget: "object"
            collapsed: true
            # Which article fills this slot is set by the Featured checkbox in
            # INSIGHTS — Articles; only the section's labels live here.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Image Placeholder Caption", name: "imageCaption", widget: "string" }
              - { label: "Link Label", name: "linkLabel", widget: "string" }
          - label: "Article Grid Section"
            name: "articleGrid"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Article Card Link Label", name: "cardLinkLabel", widget: "string" }
          - label: "Explore by Topic Section"
            name: "topics"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Heading (2 lines)"
                name: "heading"
                widget: "list"
                field: { label: "Line", name: "line", widget: "string" }
                min: 2
                max: 2
          - label: "Article Page"
            name: "articleDetail"
            widget: "object"
            collapsed: true
            # Shown on every individual article page, not on the listing.
            fields:
              - { label: "Back Link Label", name: "backLabel", widget: "string" }
          - label: "Category Filter"
            name: "categories"
            widget: "object"
            collapsed: true
            # The individual category tab labels are hardcoded options on each
            # article's Category field — only these two strings are text.
            fields:
              - { label: '"All" Tab Label', name: "allTabLabel", widget: "string" }
              - label: "Filter Bar Screen-Reader Label"
                name: "filterAriaLabel"
                widget: "string"
                hint: "Names the category filter bar for screen readers; never shown on screen."

  - name: "insights_articles"
    label: "INSIGHTS — Articles"
    icon: "article"
    # The listing page's own section text is in "INSIGHTS — Page Text".
    files:
      - file: "content/collections/insights-articles.json"
        label: "Insights Articles"
        name: "insights_articles"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # Unlocked: css/insights-article-grid.css is auto-height now
            # (was a fixed 920px 2x3 grid with overflow:hidden, where a 7th
            # non-featured article opened an invisible 3rd row), so the
            # listing grows a row at a time. The single featured slot
            # (css/insights-featured.css) still holds exactly one article --
            # build.js's validateInsightsArticles() fails the build if the
            # Featured box is checked on more than one item, or on none.
            # It also fails on a duplicate or missing URL slug, since two
            # articles sharing a slug would overwrite each other's page.
            allow_add: true
            min: 1
            fields:
              - label: "URL Slug (this article's web address — lowercase, hyphens only, must be unique)"
                name: "slug"
                widget: "string"
                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers, and hyphens only (e.g. uae-corporate-tax-guide)"]
                hint: "Becomes /insights/<slug>.html. Changing it on a published article breaks any existing link to it, so treat it as permanent once live."
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - { label: "Finance Tips", value: "finance-tips" }
                  - { label: "Cash Flow", value: "cash-flow" }
                  - { label: "VAT & Compliance", value: "vat-compliance" }
                  - { label: "Business Growth", value: "business-growth" }
                  - { label: "CFO Insights", value: "cfo-insights" }
              - label: "Featured Article (exactly one item must be checked)"
                name: "featured"
                widget: "boolean"
                default: false
              - label: "Title"
                name: "title"
                widget: "string"
                pattern: ['^.{1,132}$', "Keep it to 132 characters or fewer"]
              - label: "Excerpt"
                name: "excerpt"
                widget: "text"
                pattern: ['^.{1,183}$', "Keep it to 183 characters or fewer"]
              - label: "Read Time"
                name: "readTime"
                widget: "string"
                pattern: ['^\d{1,2} min read$', 'Format: "N min read"']
              # The article's actual page copy. Typed blocks rather than one
              # rich-text/markdown field on purpose: build.js carries no
              # markdown parser (it's dependency-free by design), and a
              # block list means the CMS can never put raw HTML on the page
              # -- every block's text is escaped like any other content
              # string. An article with an empty body still publishes: its
              # excerpt renders as the lead paragraph, exactly as all 7
              # articles do today, until the real copy is written here.
              - label: "Article Body"
                name: "body"
                widget: "list"
                required: false
                hint: "Add blocks in the order they should read. Leave empty and the excerpt shows as a one-paragraph placeholder."
                types:
                  - label: "Paragraph"
                    name: "paragraph"
                    widget: "object"
                    fields:
                      - { label: "Text", name: "text", widget: "text" }
                  - label: "Section Heading"
                    name: "heading"
                    widget: "object"
                    fields:
                      - { label: "Heading", name: "text", widget: "string" }
                  - label: "Bulleted List"
                    name: "list"
                    widget: "object"
                    fields:
                      - label: "Bullets"
                        name: "items"
                        widget: "list"
                        min: 1
                        field: { label: "Bullet", name: "item", widget: "string" }
                  - label: "Pull Quote"
                    name: "quote"
                    widget: "object"
                    fields:
                      - { label: "Quote", name: "text", widget: "text" }

  - divider: true

  # ------------------------------------------------------------ PARTNERS
  - name: "partners_intro"
    label: "PARTNERS — Page Heading & Intro"
    icon: "handshake"
    # The rest of this page's text (the closing CTA) is in "PARTNERS — Page Text".
    files:
      - file: "content/pages/partners.json"
        label: "Partners Page Intro"
        name: "partners_intro"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Intro Text", name: "intro", widget: "text" }

  - name: "copy_partners"
    label: "PARTNERS — Page Text"
    icon: "text_fields"
    files:
      - file: "content/copy/partners.json"
        label: "Partners Page Text"
        name: "copy_partners"
        # The page's heading and intro paragraph are in PARTNERS — Page Heading
        # & Intro above; this collection holds the rest of the page's text.
        fields:
          - label: "Closing Call-to-Action"
            name: "finalCta"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - { label: "Button Label", name: "buttonLabel", widget: "string" }

  - name: "partners"
    label: "PARTNERS — Partner List"
    icon: "handshake"
    # The page's heading, intro and closing CTA text are the two collections above.
    files:
      - file: "content/collections/partners.json"
        label: "Partners"
        name: "partners"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # The one collection in this CMS that's unlocked from the
            # start: css/partners-grid.css uses grid-template-columns:
            # repeat(auto-fill, ...) with no fixed row count and no
            # overflow:hidden, so adding a partner can't silently clip.
            # Ships with zero seed items -- add the first one here.
            min: 0
            fields:
              - { label: "Partner Name", name: "name", widget: "string" }
              - { label: "Logo", name: "logoSrc", widget: "image" }
              - { label: "Logo Alt Text", name: "logoAlt", widget: "string" }
              - { label: "Short Description", name: "blurb", widget: "text", pattern: ['^.{1,160}$', "Keep it to 160 characters or fewer"] }
              - { label: "Website URL (optional)", name: "websiteUrl", widget: "string", required: false }

  - divider: true

  # ------------------------------------------------------------- CONTACT
  - name: "copy_contact"
    label: "CONTACT — Page Text"
    icon: "text_fields"
    files:
      - file: "content/copy/contact.json"
        label: "Contact Page Text"
        name: "copy_contact"
        fields:
          - label: "Page Heading"
            name: "main"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading Line 1 (lead word)", name: "headingLine1Lead", widget: "string" }
              - { label: "Heading Line 1 (outlined word)", name: "headingLine1Outlined", widget: "string" }
              - { label: "Heading Line 2", name: "headingLine2", widget: "string" }
              - { label: "Heading Line 3", name: "headingLine3", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
          - label: "Contact Details"
            name: "details"
            widget: "object"
            collapsed: true
            fields:
              - label: "Email"
                name: "email"
                widget: "object"
                fields:
                  - { label: "Row Label", name: "label", widget: "string" }
                  - { label: "Email Address", name: "value", widget: "string" }
              - label: "Office Location"
                name: "office"
                widget: "object"
                fields:
                  - { label: "Row Label", name: "label", widget: "string" }
                  - { label: "Address", name: "value", widget: "string" }
              - label: "Phone"
                name: "phone"
                widget: "object"
                fields:
                  - { label: "Row Label", name: "label", widget: "string" }
                  - label: "Displayed Number"
                    name: "value"
                    widget: "string"
                    hint: "What visitors read, spaces and all (e.g. +971 50 473 4860). It is NOT used for dialling — change the dial link below to match, or the number shown and the number that actually dials will disagree."
                  - label: "Dial Link (digits only)"
                    name: "tel"
                    widget: "string"
                    hint: "The tel: link behind the number — country code and digits only, no spaces (e.g. +971504734860). Must be edited together with the displayed number above."
              - label: "Business Hours"
                name: "hours"
                widget: "object"
                fields:
                  - { label: "Row Label", name: "label", widget: "string" }
                  - { label: "Hours", name: "value", widget: "string" }
          - label: "Form Result Messages"
            name: "notices"
            widget: "object"
            collapsed: true
            # Shown in place of the form after a submit succeeds or fails.
            fields:
              - label: "Success Message"
                name: "success"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Body Text", name: "body", widget: "text" }
              - label: "Error Message"
                name: "error"
                widget: "object"
                # The body is printed in two halves with the clickable email
                # address dropped in between them.
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - label: "Body Text (before the email address)"
                    name: "bodyBeforeEmail"
                    widget: "text"
                    hint: "The linked email address is inserted straight after this text, so end it without punctuation."
                  - label: "Body Text (after the email address)"
                    name: "bodyAfterEmail"
                    widget: "string"
                    hint: "Continues the sentence immediately after the linked email address — today just the full stop that closes it."
                  - { label: "Try-Again Button Label", name: "retryLabel", widget: "string" }
          - label: "Consultation Form"
            name: "form"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading Line 1", name: "headingLine1", widget: "string" }
              - { label: "Heading Line 2", name: "headingLine2", widget: "string" }
              - label: "Field Labels & Placeholders"
                name: "fields"
                widget: "object"
                # Six fixed form fields — adding a seventh needs markup and the
                # /api handler, not a CMS edit. Keep the asterisk on the labels
                # that are actually required by the form's validation.
                fields:
                  - label: "Full Name"
                    name: "name"
                    widget: "object"
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Placeholder", name: "placeholder", widget: "string" }
                  - label: "Company Name"
                    name: "company"
                    widget: "object"
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Placeholder", name: "placeholder", widget: "string" }
                  - label: "Email Address"
                    name: "email"
                    widget: "object"
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Placeholder", name: "placeholder", widget: "string" }
                  - label: "Phone Number"
                    name: "phone"
                    widget: "object"
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Placeholder", name: "placeholder", widget: "string" }
                  - label: "Services Interested In"
                    name: "service"
                    widget: "object"
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Placeholder", name: "placeholder", widget: "text" }
                  - label: "Message"
                    name: "message"
                    widget: "object"
                    fields:
                      - { label: "Label", name: "label", widget: "string" }
                      - { label: "Placeholder", name: "placeholder", widget: "text" }
              - label: "Service Dropdown Options"
                name: "serviceOptions"
                widget: "object"
                # Only each option's visible text is editable: the option keys
                # are the values actually submitted with the form, so they stay
                # locked to what the /api handler and the inbox expect.
                fields:
                  - { label: "Bookkeeping Option", name: "bookkeeping", widget: "string" }
                  - { label: "Management Reporting Option", name: "reporting", widget: "string" }
                  - { label: "Cash Flow Option", name: "cashFlow", widget: "string" }
                  - { label: "Fractional CFO Option", name: "fractionalCfo", widget: "string" }
                  - { label: "Tax & VAT Option", name: "vat", widget: "string" }
                  - { label: '"Other" Option', name: "other", widget: "string" }
              - { label: "Submit Button Label", name: "submitLabel", widget: "string" }
          - label: "Where We Operate Section"
            name: "locations"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Sub-text (2 lines)"
                name: "subtext"
                widget: "list"
                field: { label: "Line", name: "line", widget: "string" }
                min: 2
                max: 2
              - { label: '"Core Markets" Label', name: "coreMarketsLabel", widget: "string" }
              - { label: '"Also Serving" Label', name: "alsoServingLabel", widget: "string" }
              - label: "Core Markets"
                name: "markets"
                widget: "object"
                # Two fixed market cards.
                fields:
                  - label: "First Market"
                    name: "uae"
                    widget: "object"
                    fields:
                      - label: "Short Name"
                        name: "name"
                        widget: "string"
                        hint: "This short name is ALSO drawn onto the decorative region map, which is not CMS-editable — renaming it here leaves the map's own label saying the old name until a developer redraws it."
                      - { label: "Full Country Name", name: "country", widget: "string" }
                      - { label: "Note", name: "note", widget: "string" }
                  - label: "Second Market"
                    name: "ksa"
                    widget: "object"
                    fields:
                      - label: "Short Name"
                        name: "name"
                        widget: "string"
                        hint: "This short name is ALSO drawn onto the decorative region map, which is not CMS-editable — renaming it here leaves the map's own label saying the old name until a developer redraws it."
                      - { label: "Full Country Name", name: "country", widget: "string" }
                      - { label: "Note", name: "note", widget: "string" }
              - label: "Also-Serving Chips"
                name: "chips"
                widget: "object"
                # Three fixed chips.
                fields:
                  - label: "First Chip"
                    name: "first"
                    widget: "string"
                    hint: "Sits in a box with a hand-fitted pixel width — a noticeably longer place name will not fit inside it."
                  - label: "Second Chip"
                    name: "second"
                    widget: "string"
                    hint: "Sits in a box with a hand-fitted pixel width — a noticeably longer place name will not fit inside it."
                  - label: "Third Chip"
                    name: "third"
                    widget: "string"
                    hint: "Sits in a box with a hand-fitted pixel width — a noticeably longer place name will not fit inside it."
          - label: "Quick FAQ Section"
            name: "quickFaq"
            widget: "object"
            collapsed: true
            # The heading and the questions themselves are in CONTACT — FAQ.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }

  - name: "faq_contact"
    label: "CONTACT — FAQ"
    icon: "help"
    # This section's eyebrow is text — see "CONTACT — Page Text".
    files:
      - file: "content/pages/faq-contact.json"
        label: "Contact FAQ"
        name: "faq_contact"
        fields:
          - { label: "Heading", name: "heading", widget: "string" }
          - label: "Items"
            name: "items"
            widget: "list"
            # css/contact-quick-faq.css: same auto-height flow layout as
            # the home FAQ.
            min: 3
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - divider: true

  # ----------------------------------------------------------- SITE-WIDE
  - name: "copy_site"
    label: "SITE-WIDE — Navbar, Footer & 404 Text"
    icon: "text_fields"
    files:
      - file: "content/copy/site.json"
        label: "Site-Wide Text"
        name: "copy_site"
        # Every string here appears on every page of the site, so an edit is
        # site-wide by definition — the navbar and footer are rendered from one
        # partial into all pages.
        fields:
          - label: "Navbar"
            name: "navbar"
            widget: "object"
            collapsed: true
            # The nav link labels themselves are in SITE-WIDE — Top Navigation
            # Links.
            fields:
              - { label: "Logo Alt Text", name: "logoAlt", widget: "string" }
              - { label: "Button Label", name: "ctaLabel", widget: "string" }
              - label: "Mobile Menu Button Screen-Reader Label"
                name: "menuToggleLabel"
                widget: "string"
                hint: "The hamburger button has no visible text — this is what a screen reader announces for it."
          - label: "Footer"
            name: "footer"
            widget: "object"
            collapsed: true
            # The footer's link lists are separate collections (SITE-WIDE —
            # Footer Company Links / Footer Social Links); the services column
            # is generated from SERVICES — Service List.
            fields:
              - { label: "Logo Alt Text", name: "logoAlt", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Arabic Tagline", name: "taglineAr", widget: "string" }
              - { label: '"Services" Column Title', name: "servicesTitle", widget: "string" }
              - { label: '"Company" Column Title', name: "companyTitle", widget: "string" }
              - { label: '"Contact" Column Title', name: "contactTitle", widget: "string" }
              - { label: '"Follow" Column Title', name: "followTitle", widget: "string" }
              - { label: "Contact Email", name: "contactEmail", widget: "string" }
              - { label: "Regions Line", name: "contactRegions", widget: "string" }
              - { label: "Business Hours Line", name: "contactHours", widget: "string" }
              - label: "Copyright Line"
                name: "copyright"
                widget: "string"
                hint: "The year here is plain text, not generated at build time — it goes stale on 1 January unless someone edits it."
          - label: "404 Page"
            name: "error404"
            widget: "object"
            collapsed: true
            # Shown by 404.html when a visitor hits a URL this site doesn't
            # have; its page title and description are in SITE-WIDE — Page
            # Titles & Search Descriptions.
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Body Text", name: "body", widget: "text" }
              - { label: "Button Label", name: "buttonLabel", widget: "string" }

  - name: "seo_pages"
    label: "SITE-WIDE — Page Titles & Search Descriptions"
    icon: "search"
    files:
      - file: "content/seo.json"
        label: "Page Titles & Search Descriptions"
        name: "seo_pages"
        fields:
          - label: "Pages"
            name: "pages"
            widget: "object"
            # One entry per built page, keyed by that page's file name (build.js
            # looks up seo.pages[<output file without .html>]), so the keys are
            # locked -- a renamed key silently falls back to the developer
            # default in src/pages/*.json instead of erroring. Individual
            # insights articles are not listed here: their title and description
            # are derived from the article's own Title and Excerpt.
            fields:
              - label: "404 Page"
                name: "404"
                widget: "object"
                collapsed: true
                fields:
                  - { label: "Page Title", name: "title", widget: "string", hint: "The clickable headline in Google results — aim for ~60 characters so it isn't cut off." }
                  - { label: "Search Description", name: "description", widget: "text", hint: "The grey snippet under the title in Google results — aim for ~155 characters so it isn't cut off." }
              - label: "About"
                name: "about"
                widget: "object"
                collapsed: true
