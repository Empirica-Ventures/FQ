  - name: "industries"
    label: "INDUSTRIES — Industry List"
    icon: "factory"
    # The page hero and the repeated per-industry labels are in "INDUSTRIES — Page Text".
    files:
      - file: "content/collections/industries.json"
        label: "Industries"
        name: "industries"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # Unlocked: css/industries-quick-nav.css's quick-nav bar now
            # scrolls instead of clipping past a fixed-width row, and the
            # home teaser grid (css/home-industries.css) wraps to
