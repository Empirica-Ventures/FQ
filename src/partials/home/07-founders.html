<section class="founders">
  <div class="founders__inner">
    <div class="founders__ring" aria-hidden="true"></div>

    <p class="founders__eyebrow animate-on-scroll">{{TXT_HOME_FOUNDERS_EYEBROW}}</p>
    <h2 class="founders__heading animate-on-scroll">{{TXT_HOME_FOUNDERS_HEADING}}</h2>
    <a href="/about.html" class="founders__cta animate-on-scroll">{{TXT_HOME_FOUNDERS_CTA_LABEL}}</a>

    <div class="founders__members">
      <div class="founders__member">
        <div class="founders__portrait founders__portrait--mudassir">
          <img src="{{IMG_HOME_FOUNDER_MUDASSIR_SRC}}" width="{{IMG_HOME_FOUNDER_MUDASSIR_WIDTH}}" height="{{IMG_HOME_FOUNDER_MUDASSIR_HEIGHT}}" alt="{{IMG_HOME_FOUNDER_MUDASSIR_ALT}}" loading="lazy" />
        </div>
        <p class="founders__name">{{TXT_HOME_FOUNDERS_FIRST_NAME}}</p>
        <p class="founders__role">{{TXT_HOME_FOUNDERS_FIRST_ROLE}}</p>
      </div>

      <div class="founders__member">
        <div class="founders__portrait founders__portrait--muzammil">
          <img src="{{IMG_HOME_FOUNDER_MUZAMMIL_SRC}}" width="{{IMG_HOME_FOUNDER_MUZAMMIL_WIDTH}}" height="{{IMG_HOME_FOUNDER_MUZAMMIL_HEIGHT}}" alt="{{IMG_HOME_FOUNDER_MUZAMMIL_ALT}}" loading="lazy" />
        </div>
        <p class="founders__name">{{TXT_HOME_FOUNDERS_SECOND_NAME}}</p>
        <p class="founders__role">{{TXT_HOME_FOUNDERS_SECOND_ROLE}}</p>
      </div>
    </div>
  </div>
</section>
