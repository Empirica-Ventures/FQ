                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Lowercase letters, numbers, and hyphens only (e.g. renewable-energy)"]
                hint: "Becomes /industries.html#<id> and that page's own anchor for this section. A duplicate or changed id breaks navigation for whichever industry already used it -- src/render/home/08-industries.js fails the build if two industries share one. New industries fall back to a generic icon (src/render/_fixtures/home-industries-icons.js) unless a developer adds a hand-drawn one for this id."
