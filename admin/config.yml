  - divider: true

  # ----------------------------------------------------------- SITE-WIDE
  - name: "footer_social_links"
    label: "SITE-WIDE — Footer Social Links"
    icon: "share"
    files:
      - file: "content/collections/footer-social-links.json"
        label: "Footer Social Links"
        name: "footer_social_links"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # Fixed-height footer column (css/footer.css: height:400px on
            # .footer__inner, nowrap labels) -- count is locked, but unlike
            # the internal nav/footer links below, these hrefs point to
            # external social profiles with no build-time route to break,
            # so both label and URL are editable.
            allow_add: false
            min: 3
            max: 3
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Profile URL", name: "href", widget: "string" }

  - name: "nav_links"
    label: "SITE-WIDE — Top Navigation Links"
    icon: "menu"
    files:
      - file: "content/collections/nav-links.json"
        label: "Top Navigation Links"
        name: "nav_links"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            # css/navbar.css: nowrap labels, no wrap protection -- a 9th
            # link has nowhere to go. Each href points to one of this
            # site's own pages, so it's locked (an internal link this
            # site doesn't actually have would 404); only the visible
            # label text is editable.
            allow_add: false
            min: 8
            max: 8
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Page URL (locked)", name: "href", widget: "hidden" }

