<section class="svc-detail-hero svc-detail-hero--green">
  <div class="svc-detail-hero__inner">
    <div class="svc-detail-hero__grid" aria-hidden="true"></div>

    <div class="svc-detail-hero__ring svc-detail-hero__ring--1" aria-hidden="true"></div>
    <div class="svc-detail-hero__ring svc-detail-hero__ring--2" aria-hidden="true"></div>
    <div class="svc-detail-hero__ring svc-detail-hero__ring--3" aria-hidden="true"></div>
    <div class="svc-detail-hero__dot" aria-hidden="true"></div>

    <div class="svc-detail-hero__icon svc-detail-hero__icon--fpa">
      <span class="fpa-head"></span>
      <span class="fpa-body"></span>
      <span class="fpa-mask"></span>
    </div>

    <p class="svc-detail-hero__eyebrow animate-on-scroll">{{TXT_SERVICE_DETAILS_FPA_HERO_EYEBROW}}</p>
    <h1 class="svc-detail-hero__heading animate-on-scroll">{{TXT_SERVICE_DETAILS_FPA_HERO_HEADING_LEAD}}<br><span class="text-outline">{{TXT_SERVICE_DETAILS_FPA_HERO_HEADING_OUTLINED}}</span></h1>
    <div class="svc-detail-hero__rule animate-on-scroll"></div>
    <p class="svc-detail-hero__body animate-on-scroll">{{TXT_SERVICE_DETAILS_FPA_HERO_BODY}}</p>
  </div>
</section>
