<section class="insights-hero">
  <div class="insights-hero__bg" aria-hidden="true">
    <img src="{{IMG_INSIGHTS_HERO_BG_SRC}}" width="{{IMG_INSIGHTS_HERO_BG_WIDTH}}" height="{{IMG_INSIGHTS_HERO_BG_HEIGHT}}" alt="{{IMG_INSIGHTS_HERO_BG_ALT}}" loading="eager" fetchpriority="high" />
  </div>
  <div class="insights-hero__inner">
    <div class="insights-hero__rings" aria-hidden="true">
      <div class="insights-hero__ring" style="left:950px; top:-120px; width:500px; height:500px;"></div>
      <div class="insights-hero__ring" style="left:1200px; top:200px; width:300px; height:300px;"></div>
      <div class="insights-hero__ring" style="left:800px; top:360px; width:160px; height:160px;"></div>
    </div>

    <p class="insights-hero__eyebrow animate-on-scroll">{{TXT_INSIGHTS_HERO_EYEBROW}}</p>
    <p class="insights-hero__watermark" aria-hidden="true">INS</p>

    <h1 class="insights-hero__title animate-on-scroll">
      <span class="insights-hero__title-line">{{TXT_INSIGHTS_HERO_TITLE_LEAD}}</span>
      <span class="insights-hero__title-line text-outline">{{TXT_INSIGHTS_HERO_TITLE_OUTLINED}}</span>
    </h1>

    <p class="insights-hero__body animate-on-scroll">{{TXT_INSIGHTS_HERO_BODY}}</p>

    <div class="insights-hero__newsletter">
      <p class="insights-hero__newsletter-title">{{TXT_INSIGHTS_HERO_NEWSLETTER_TITLE}}</p>
      <p class="insights-hero__newsletter-subtitle">{{TXT_INSIGHTS_HERO_NEWSLETTER_SUBTITLE}}</p>
      <form class="insights-hero__form">
        <input class="insights-hero__input" type="email" placeholder="{{TXTA_INSIGHTS_HERO_NEWSLETTER_EMAIL_PLACEHOLDER}}" aria-label="{{TXTA_INSIGHTS_HERO_NEWSLETTER_EMAIL_LABEL}}" />
        <button class="insights-hero__submit" type="submit">{{TXT_INSIGHTS_HERO_NEWSLETTER_SUBMIT_LABEL}}</button>
      </form>
    </div>
  </div>
</section>
