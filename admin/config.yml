            allow_add: false
            min: 5
            max: 5
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Page URL (locked)", name: "href", widget: "hidden" }

  - name: "images"
    label: "SITE-WIDE — Site Images"
    icon: "image"
    files:
      - file: "content/images.json"
        label: "Site Images"
        name: "images"
        fields:
          - label: "Images"
            name: "items"
            widget: "object"
            # Every key below is a fixed slot referenced by name from a
            # specific {{IMG_<KEY>_...}} token in a specific partial (see
            # build.js's imageTokens()) — the keys themselves are locked;
            # only each slot's file, alt text, and real dimensions are
            # editable. Width/height are NOT locked: they're meant to be
            # updated whenever the image is replaced (verify/check_image_
            # dims.js only warns, never fails, on a mismatch, since these
            # are CLS-prevention layout hints, not exact pixel enforcement).
            fields:
