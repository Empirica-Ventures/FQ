<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 150" role="img" aria-label="Odoo">
  <!-- Odoo wordmark: four ring glyphs (o, d, o, o) on a shared baseline, the
       "d" formed by a ring plus an ascender rising from its right centreline.
       Drawn as stroked circles so the ring weight stays exact at any size.
       Ring centreline r=41 with an 18 stroke gives a 50 outer / 32 inner
       radius, matching the proportions of the supplied artwork. -->
  <g fill="none" stroke-width="18">
    <circle cx="50" cy="100" r="41" stroke="#a24689" />
    <g stroke="#9e9e9e">
      <circle cx="160" cy="100" r="41" />
      <path d="M201 100 V15" stroke-linecap="round" />
      <circle cx="270" cy="100" r="41" />
      <circle cx="380" cy="100" r="41" />
    </g>
  </g>
</svg>
